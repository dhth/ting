name: audit

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 2,6'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: rust cargo-deny
      - name: cargo deny
        run: mise run deny
