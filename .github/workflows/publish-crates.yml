name: publish-crates

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: macos-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Set up mise
        uses: jdx/mise-action@v4
        with:
          install_args: rust
      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
