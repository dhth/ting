[package]
name = "ting"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/dhth/ting"
description = "audio feedback for command exit codes"
homepage = "https://github.com/dhth/ting"
keywords = [
    "cli",
    "audio",
    "notifications",
]
categories = [
    "command-line-utilities",
]
exclude = [
    ".github",
    "clippy.toml",
    "deny.toml",
    "docker-compose.yml",
    "justfile",
]

[dependencies]
anyhow = "1.0.98"
etcetera = "0.10.0"
rodio = { version = "0.21.1", default-features = false, features = ["playback", "tracing", "wav"] }
serde = { version = "1.0.219", features = ["derive"] }
toml = { version = "0.9.2", features = ["parse"] }

[dev-dependencies]
insta = { version = "1.43.1", features = ["yaml"] }
insta-cmd = "0.6.0"
